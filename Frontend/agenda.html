<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarberControl - Agendamento</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-item active">
          <div class="label">
            <strong>Agendamento</strong>
            <span>Calendário do mês</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <h1>Agendamento</h1>
          <p id="mes-descricao">
            Calendário do mês. Selecione um dia para ver e registrar horários
          </p>
          <hr />
        </div>

        <div class="content-grid">
          <div class="card">
            <div class="calendar-header">
              <h2 id="mes-titulo">Agosto 2026</h2>
              <span class="count" id="total-mes">0 agendamentos no mês</span>
            </div>

            <div class="calendar-grid" id="calendario">
              <!-- dias preenchidos via JS -->
            </div>
          </div>

          <div class="side-column">
            <div class="card">
              <h3>Novo Agendamento</h3>
              <p class="card-subtitle" id="novo-agendamento-dia">
                Dia --/--/----
              </p>

              <form id="form-novo-agendamento">
                <div class="field">
                  <label for="cliente-nome">Cliente</label>
                  <input
                    type="text"
                    id="cliente-nome"
                    placeholder="Nome do cliente"
                    required
                  />
                </div>

                <div class="form-row">
                  <div class="field">
                    <label for="servico">Serviço</label>
                    <select id="servico" required></select>
                  </div>
                  <div class="field">
                    <label for="horario">Horário</label>
                    <select id="horario" required></select>
                  </div>
                </div>

                <div class="field">
                  <label for="barbeiro">Barbeiro</label>
                  <select id="barbeiro" required></select>
                </div>

                <div class="form-error" id="erro-agendamento"></div>

                <button type="submit" class="btn-primary">+ Agendar</button>
              </form>
            </div>

            <div class="card">
              <h3 id="agenda-dia-titulo">Agenda do dia --/--</h3>
              <div class="agenda-list" id="agenda-lista">
                <p class="agenda-empty">
                  Nenhum horário agendado para este dia.
                </p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/agenda.js"></script>
  </body>
</html>
