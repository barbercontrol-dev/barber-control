<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarberControl - Cadastro</title>
  <style>
    :root {
      --color-primary: #ffc107;
      --color-white: #ffffff;
      --color-dark: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: var(--color-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
              radial-gradient(
                      circle at 10% 15%,
                      rgba(51, 51, 51, 0.05) 0,
                      transparent 40%
              ),
              radial-gradient(
                      circle at 85% 20%,
                      rgba(51, 51, 51, 0.05) 0,
                      transparent 40%
              ),
              radial-gradient(
                      circle at 25% 80%,
                      rgba(51, 51, 51, 0.05) 0,
                      transparent 40%
              ),
              radial-gradient(
                      circle at 90% 75%,
                      rgba(51, 51, 51, 0.05) 0,
                      transparent 40%
              );
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      max-width: 820px;
      min-height: 400px;
      background: var(--color-white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(51, 51, 51, 0.25);
    }

    .form-side {
      flex: 1 1 50%;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 1.9rem;
      font-weight: 400;
      color: var(--color-dark);
      letter-spacing: 0.5px;
    }

    .brand p {
      margin-top: 4px;
      font-size: 0.95rem;
      color: #666;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--color-dark);
      margin-bottom: 6px;
    }

    .required {
      color: #e53935;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      padding: 10px 36px 10px 12px;
      border: none;
      border-bottom: 1.5px solid #ccc;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--color-dark);
      background: transparent;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input-wrap input:focus {
      border-bottom-color: var(--color-primary);
    }

    .toggle-visibility {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-visibility:hover {
      color: var(--color-dark);
    }

    .toggle-visibility svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .toggle-visibility .icon-off {
      display: none;
    }

    .toggle-visibility.is-visible .icon-on {
      display: none;
    }

    .toggle-visibility.is-visible .icon-off {
      display: block;
    }

    .field-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 18px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .field-checkbox input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #3b7ddd;
    }

    .field-checkbox label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .field-checkbox a {
      color: #3b7ddd;
      text-decoration: underline;
    }

    .form-erro {
      display: none;
      font-size: 0.85rem;
      color: #c0392b;
      background: rgba(192, 57, 43, 0.08);
      border: 1px solid rgba(192, 57, 43, 0.25);
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 12px;
    }

    .form-erro.visivel {
      display: block;
    }

    .submit-btn {
      display: block;
      margin: 8px auto 0;
      padding: 12px 40px;
      background: #cfcfcf;
      color: #555;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition:
              background-color 0.15s ease,
              color 0.15s ease;
    }

    .submit-btn:hover {
      background: var(--color-primary);
      color: var(--color-dark);
    }

    .image-side {
      flex: 1 1 50%;
      position: relative;
      background: linear-gradient(
              135deg,
              #1a1a1a 0%,
              #4a4a4a 45%,
              #d9c98a 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      mix-blend-mode: multiply;
      opacity: 0.95;
    }

    @media (max-width: 720px) {
      .card {
        flex-direction: column;
        max-width: 420px;
      }

      .image-side {
        min-height: 220px;
        order: -1;
      }

      .form-side {
        padding: 36px 28px;
      }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="form-side">
    <div class="brand">
      <h1>BarberControl</h1>
      <p>Seja bem vindo(a)!</p>
    </div>

    <form id="form-cadastro">
      <div class="field">
        <label for="nome"
        >Nome completo <span class="required">*</span></label
        >
        <div class="input-wrap">
          <input
                  type="text"
                  id="nome"
                  name="nome"
                  autocomplete="name"
                  required
          />
        </div>
      </div>

      <div class="field">
        <label for="email">👤 Email <span class="required">*</span></label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" required />
        </div>
      </div>

      <div class="field">
        <label for="senha"
        >Criar senha <span class="required">*</span></label
        >
        <div class="input-wrap">
          <input type="password" id="senha" name="senha" required />
          <button
                  type="button"
                  class="toggle-visibility"
                  data-target="senha"
                  aria-label="Mostrar senha"
          >
            <svg
                    class="icon-on"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg
                    class="icon-off"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
              <path
                      d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="repetir-senha"
        >Repetir senha <span class="required">*</span></label
        >
        <div class="input-wrap">
          <input
                  type="password"
                  id="repetir-senha"
                  name="repetir-senha"
                  required
          />
          <button
                  type="button"
                  class="toggle-visibility"
                  data-target="repetir-senha"
                  aria-label="Mostrar senha"
          >
            <svg
                    class="icon-on"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg
                    class="icon-off"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
              <path
                      d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- CHECKBOX DA POLÍTICA DE PRIVACIDADE ADICIONADO AQUI -->
      <div class="field-checkbox">
        <input type="checkbox" id="aceite-lgpd" required />
        <label for="aceite-lgpd">
          Li e concordo com a <a href="politica-privacidade.html" target="_blank">Política de Privacidade</a>
        </label>
      </div>

      <p id="form-erro" role="alert" aria-live="polite"></p>
      <button type="submit" class="submit-btn" id="btn-cadastrar">
        Cadastrar
      </button>
    </form>
  </div>

  <div class="image-side">
    <img
            src="imgs/barber-image.png"
            alt="Ilustração de barbeiro cortando cabelo"
    />
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
